<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f5f5f5;
        }

        .container {
            width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
        }

        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
        }

        th {
            background: #333;
            color: white;
        }

        a {
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management System</h1>

    <form method="POST">

        {% csrf_token %}

        <input type="text" name="name"
               placeholder="Student Name" required>

        <input type="email" name="email"
               placeholder="Email" required>

        <input type="text" name="course"
               placeholder="Course" required>

        <input type="number" name="age"
               placeholder="Age" required>

        <button type="submit">Add Student</button>

    </form>


    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Age</th>
            <th>Action</th>
        </tr>

        {% for student in students %}

        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.course }}</td>
            <td>{{ student.age }}</td>

            <td>
                <a href="{% url 'delete_student' student.id %}">
                    Delete
                </a>
            </td>
        </tr>

        {% empty %}

        <tr>
            <td colspan="6">
                No students found
            </td>
        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
